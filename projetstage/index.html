<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Affiche une citation aléatoire depuis une API.">
  <title>Citation aléatoire</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">
  <main class="container p-4 p-md-5 bg-white rounded-4 shadow-sm" style="max-width: 560px;">
    <h1 class="h2 mb-4 text-center">Citation aléatoire</h1>
    <p id="citation" aria-live="polite" class="fs-5 text-secondary mb-4">Clique sur le bouton pour afficher une citation.</p>
    <div class="d-grid">
      <button type="button" class="btn btn-success btn-lg" onclick="getCitation()">Afficher la citation</button>
    </div>
  </main>

  <script>
    function getCitation() {
      const citationEl = document.getElementById("citation");
      citationEl.textContent = "Chargement...";

      fetch("https://dummyjson.com/quotes/random")
        .then(response => {
          if (!response.ok) {
            throw new Error("Réponse réseau invalide");
          }
          return response.json();
        })
        .then(data => {
          citationEl.textContent = `${data.quote} — ${data.author}`;
        })
        .catch(error => {
          citationEl.textContent = "Erreur lors de la récupération de la citation.";
          console.error(error);
        });
    }

    
  </script>
</body>
</html>
