
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion administrateur - Moodies</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container min-vh-100 d-flex justify-content-center align-items-center">

        <div class="card shadow p-4" style="width: 100%; max-width: 420px;">

            <h3 class="text-center mb-2">MOODIES</h3>
            <p class="text-center text-muted mb-4">Espace administrateur</p>

            <form id="form-connexion">

                <div class="mb-3">
                    <label class="form-label">Adresse e-mail</label>
                    <input type="email" id="email" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Mot de passe</label>
                    <input type="password" id="motDePasse" class="form-control" required>
                </div>

                <button type="submit" class="btn btn-dark w-100">
                    Se connecter
                </button>

                <p id="message" class="text-center mt-3"></p>

            </form>

        </div>

    </div>

    <script>
        document.getElementById("form-connexion").addEventListener("submit", async (e) => {

            e.preventDefault();

            const email = document.getElementById("email").value;
            const motDePasse = document.getElementById("motDePasse").value;
            const message = document.getElementById("message");

            try {
                const reponse = await fetch("/api/admin/connexion", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ email, motDePasse })
                });

                const resultat = await reponse.json();

                if (reponse.ok) {
                    window.location.href = "/admin";
                } else {
                    message.textContent = resultat.message;
                    message.className = "text-danger text-center mt-3";
                }

            } catch (erreur) {
                message.textContent = "Impossible de contacter le serveur.";
                message.className = "text-danger text-center mt-3";
            }

        });
    </script>

</body>
</html>
